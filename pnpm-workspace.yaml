# Supply-chain policy lives here because both the project-pinned pnpm 10
# runtime and newer pnpm launchers read workspace settings from this file.
# A packages key is intentionally omitted: this repository is a single package.
minimumReleaseAge: 4320
verifyDepsBeforeRun: warn

# Dependency lifecycle scripts are blocked unless explicitly approved here.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Keep vulnerable transitive parsers, glob tooling, and image tooling on patched
# lines. These are build-time inputs today, but content and images still cross
# trust boundaries in local authoring and CI.
overrides:
  brace-expansion@<1.1.17: 1.1.17
  js-yaml@<3.15.0: 3.15.0
  'js-yaml@>=4.0.0 <4.3.0': 4.3.0
  postcss@<8.5.18: '>=8.5.18'
  sharp@<0.35.0: 0.35.3
