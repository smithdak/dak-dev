name: Content Check

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.imgbotconfig'
      - 'content/**'
      - '.content/**'
      - 'app/globals.css'
      - 'assets/fonts/**'
      - 'public/brand/**'
      - 'public/og-default.png'
      - 'public/images/**'
      - 'lib/content-validation/**'
      - 'lib/toolkit*.ts'
      - 'components/toolkit/**'
      - 'app/learn/toolkit/**'
      - 'scripts/validate-posts.ts'
      - 'scripts/generate-post-images.ts'
      - 'scripts/generate-brand-assets.ts'

permissions:
  contents: read

jobs:
  validate:
    name: Content Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run content validation
        run: pnpm run validate:content:all -- --ci

      - name: Validate Toolkit evidence contract
        if: always()
        run: pnpm validate:toolkit

      - name: Run image validation
        if: always()
        run: pnpm images:validate

      - name: Validate deterministic brand assets
        if: always()
        run: pnpm brand:check

      - name: Upload validation evidence
        if: always() && hashFiles('.content/validation-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-validation-report
          path: .content/validation-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Check score threshold
        if: always() && hashFiles('.content/validation-report.json') != ''
        run: >-
          node -e "const report=require('./.content/validation-report.json');
          const score=report?.summary?.average_score;
          if(!Number.isInteger(score)||score<80){
          console.error('Average content score is invalid or below 80:',score);
          process.exit(1)}"

  comment:
    name: Publish Validation Report
    needs: validate
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download validation evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: content-validation-report
          path: validation-evidence

      - name: Post PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const report = JSON.parse(
              fs.readFileSync('validation-evidence/validation-report.json', 'utf8')
            );

            const integer = (value, label) => {
              if (!Number.isInteger(value) || value < 0) {
                throw new Error(`Invalid ${label} in validation report`);
              }
              return value;
            };
            const cell = (value) => String(value ?? '')
              .replaceAll('\\', '\\\\')
              .replaceAll('|', '\\|')
              .replace(/[\r\n]+/g, ' ')
              .replaceAll('<', '&lt;')
              .replaceAll('@', '&#64;');

            const summary = report.summary ?? {};
            const total = integer(summary.total, 'total');
            const passed = integer(summary.passed, 'passed');
            const failed = integer(summary.failed, 'failed');
            const warnings = integer(summary.warnings, 'warnings');
            const averageScore = integer(summary.average_score, 'average score');
            if (averageScore > 100 || passed + failed !== total) {
              throw new Error('Inconsistent validation report summary');
            }

            const results = Array.isArray(report.results) ? report.results.slice(0, 100) : [];
            const rows = results.map((result) => {
              const score = integer(result.score, 'result score');
              const issues = integer(result.issueCount, 'issue count');
              const resultWarnings = integer(result.warningCount, 'warning count');
              if (score > 100 || typeof result.passed !== 'boolean') {
                throw new Error('Invalid result in validation report');
              }
              return `| ${cell(result.title)} | ${score}/100 | ${result.passed ? 'Pass' : 'Fail'} | ${issues} | ${resultWarnings} |`;
            }).join('\n');

            const scoreEmoji = averageScore >= 90 ? '🟢' : averageScore >= 80 ? '🟡' : '🔴';
            const marker = '<!-- content-validation-report -->';
            const body = `${marker}
            ## ${scoreEmoji} Content Validation Report

            | Metric | Value |
            |--------|-------|
            | Posts checked | ${total} |
            | Passed | ${passed} |
            | Failed | ${failed} |
            | Warnings | ${warnings} |
            | **Average Score** | **${averageScore}/100** |

            ### Results

            | Post | Score | Status | Issues | Warnings |
            |------|-------|--------|--------|----------|
            ${rows || '| No results | 0/100 | Fail | 0 | 0 |'}

            ---
            *Generated by content-check workflow*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
