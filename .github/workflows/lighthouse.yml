name: Lighthouse

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://daksmith.dev
  NEXT_PUBLIC_GISCUS_REPO: smithdak/dak-dev
  NEXT_PUBLIC_GISCUS_REPO_ID: R_kgDONxWbPw
  NEXT_PUBLIC_GISCUS_CATEGORY: General
  NEXT_PUBLIC_GISCUS_CATEGORY_ID: DIC_kwDONxWbP84Cmgsy

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Post results as PR comment
        if: always() && steps.lighthouse.outputs.manifest != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const results = ${{ steps.lighthouse.outputs.manifest }};

            if (!results || results.length === 0) {
              console.log('No Lighthouse results found');
              return;
            }

            const representativeRuns = results.filter((result) => result.isRepresentativeRun);
            const displayedRuns = representativeRuns.length > 0
              ? representativeRuns
              : [...new Map(results.map((result) => [result.url, result])).values()];

            let lighthouseVersion = 'unknown';
            let chromeVersion = 'unknown';
            try {
              const report = JSON.parse(fs.readFileSync(displayedRuns[0].jsonPath, 'utf8'));
              lighthouseVersion = report.lighthouseVersion ?? lighthouseVersion;
              chromeVersion = report.environment?.hostUserAgent?.match(/Chrome\/([^\s]+)/)?.[1] ?? chromeVersion;
            } catch (error) {
              console.log(`Unable to read Lighthouse version metadata: ${error.message}`);
            }

            const scoreColor = (score) => {
              if (score >= 0.95) return '🟢';
              if (score >= 0.80) return '🟡';
              return '🔴';
            };

            const formatScore = (score) => `${scoreColor(score)} ${Math.round(score * 100)}`;

            let table = '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            table += '|-----|-------------|---------------|----------------|-----|\n';

            for (const result of displayedRuns) {
              const url = new URL(result.url).pathname || '/';
              const cats = result.summary;
              table += `| ${url} | ${formatScore(cats.performance)} | ${formatScore(cats.accessibility)} | ${formatScore(cats['best-practices'])} | ${formatScore(cats.seo)} |\n`;
            }

            const marker = '<!-- lighthouse-ci-results -->';
            const body = `${marker}\n## Lighthouse CI merge gate\n\n${table}\n\n` +
              `Representative runs shown · Lighthouse ${lighthouseVersion} · Chrome ${chromeVersion}\n\n` +
              `Performance uses the median run; correctness categories fail on the worst run. ` +
              `Full reports are preserved as workflow artifacts.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker) || comment.body?.includes('Lighthouse Audit Results')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # The pinned LHCI action bundles Lighthouse 12.6.1. Keep the current major
  # isolated until LHCI officially supports it; do not override its dependency.
  lighthouse-current:
    name: Lighthouse 13.4.1 desktop advisory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Verify advisory Lighthouse version
        shell: bash
        run: |
          version="$(pnpm exec lighthouse --version)"
          if [[ "$version" != "13.4.1" ]]; then
            echo "Expected Lighthouse 13.4.1, received $version"
            exit 1
          fi

      - name: Start production server
        shell: bash
        run: |
          pnpm start > /tmp/dak-dev-next.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dak-dev-next.log
          exit 1

      - name: Run current Lighthouse diagnostics
        shell: bash
        run: |
          mkdir -p .lighthouse-current
          pnpm exec lighthouse --version > .lighthouse-current/version.txt

          for target in \
            "home:/" \
            "blog:/blog" \
            "patterns:/learn/patterns" \
            "toolkit:/learn/toolkit" \
            "work:/work"
          do
            name="${target%%:*}"
            route="${target#*:}"
            pnpm exec lighthouse "http://127.0.0.1:3000${route}" \
              --preset=desktop \
              --only-categories=performance,accessibility,best-practices,seo,agentic-browsing \
              --output=html \
              --output=json \
              --output-path=".lighthouse-current/${name}" \
              --chrome-flags="--headless --no-sandbox"
          done

      - name: Upload Lighthouse 13.4.1 desktop reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-13.4.1-desktop-advisory
          path: .lighthouse-current
          if-no-files-found: warn
          retention-days: 14
